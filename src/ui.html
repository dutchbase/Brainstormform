<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brainstormform</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel-2:#fbfbfe; --text:#171a23; --muted:#646b7d;
    --border:#e3e6ef; --border-strong:#cdd2e0; --accent:#5b5bd6; --accent-ink:#ffffff;
    --accent-soft:#ececfb; --danger:#c0392b; --ok:#1f9d6b; --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,24,40,.05), 0 8px 24px rgba(20,24,40,.06);
  }
  html[data-theme="dark"]{
    --bg:#0f1117; --panel:#171a23; --panel-2:#1c202b; --text:#eceef5; --muted:#9aa2b6;
    --border:#262b38; --border-strong:#333a4c; --accent:#8b8bf0; --accent-ink:#12131a;
    --accent-soft:#242a3d; --danger:#ff6b5e; --ok:#4ad295;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%;
  }
  .bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
  .bar-in{max-width:820px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{font-weight:650; letter-spacing:-.01em; display:flex; align-items:center; gap:9px}
  .dot{width:11px; height:11px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#a06bf0)}
  .icon-btn{background:transparent; border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:16px; line-height:1; transition:background .15s, border-color .15s}
  .icon-btn:hover{background:var(--panel-2); border-color:var(--border-strong)}
  .progress{height:3px; background:transparent}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#a06bf0); transition:width .3s cubic-bezier(.4,0,.2,1)}
  .wrap{max-width:820px; width:100%; margin:0 auto; padding:28px 20px 120px; flex:1}
  .intro{margin:6px 0 22px}
  .intro h1{font-size:26px; line-height:1.25; margin:0 0 8px; letter-spacing:-.02em}
  .intro p{margin:0; color:var(--muted); white-space:pre-wrap}
  .page.anim > .q{animation:rise .26s cubic-bezier(.2,.7,.2,1) both}
  .page[data-dir="back"].anim > .q{animation-name:riseBack}
  @keyframes rise{from{opacity:0; transform:translateX(16px)} to{opacity:1; transform:none}}
  @keyframes riseBack{from{opacity:0; transform:translateX(-16px)} to{opacity:1; transform:none}}
  .q{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:14px; box-shadow:var(--shadow); scroll-margin-top:90px}
  .q.invalid{border-color:var(--danger)}
  .cat{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:7px}
  .qlabel{font-weight:600; font-size:16.5px; margin:0 0 4px; letter-spacing:-.01em}
  .req{color:var(--danger); margin-left:4px}
  .help{margin:2px 0 12px; color:var(--muted); font-size:13.5px}
  .opts{display:grid; gap:9px; margin-top:12px}
  .opt{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; background:var(--panel-2); transition:border-color .15s, background .15s, transform .08s}
  .opt:hover{border-color:var(--border-strong)}
  .opt:active{transform:scale(.995)}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .opt input{margin:3px 0 0; accent-color:var(--accent); width:17px; height:17px; flex:none}
  .opt-main{display:flex; flex-direction:column; gap:2px; min-width:0}
  .opt-label{font-weight:520}
  .opt-desc{color:var(--muted); font-size:13.5px}
  .text-input,textarea.ta,input.num{width:100%; font:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 13px; transition:border-color .15s, box-shadow .15s}
  .text-input:focus,textarea.ta:focus,input.num:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.ta{resize:vertical; min-height:104px}
  .other-input{margin-top:9px}
  .ta-wrap{position:relative}
  .count{position:absolute; right:10px; bottom:8px; font-size:12px; color:var(--muted); pointer-events:none}
  .segs{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
  .seg{font:inherit; cursor:pointer; padding:9px 15px; min-width:44px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:999px; transition:transform .08s, border-color .15s, background .15s}
  .seg:hover{border-color:var(--border-strong)}
  .seg:active{transform:scale(.96)}
  .seg.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .scale-labels{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-top:7px; max-width:420px}
  .drop{margin-top:12px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-sm); padding:18px; text-align:center; color:var(--muted); cursor:pointer; background:var(--panel-2); transition:border-color .15s, background .15s}
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--text)}
  .files{display:grid; gap:8px; margin-top:10px}
  .file{display:flex; align-items:center; gap:11px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--panel-2)}
  .file img{width:38px; height:38px; object-fit:cover; border-radius:7px; flex:none}
  .file .ficon{width:38px; height:38px; border-radius:7px; background:var(--accent-soft); display:grid; place-items:center; font-size:15px; flex:none}
  .file .fmeta{min-width:0; flex:1}
  .file .fname{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file .fsize{font-size:12px; color:var(--muted)}
  .rm{background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:17px; padding:4px 7px; border-radius:7px}
  .rm:hover{color:var(--danger); background:var(--panel)}
  .err{color:var(--danger); font-size:13.5px; margin:10px 0 0}
  .foot{position:sticky; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--border)}
  .foot-in{max-width:820px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px; justify-content:space-between}
  .btn{font:inherit; font-weight:560; cursor:pointer; border-radius:11px; padding:11px 18px; border:1px solid transparent; transition:transform .08s, opacity .15s, background .15s, border-color .15s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.primary{background:var(--accent); color:var(--accent-ink)}
  .btn.primary:hover{opacity:.92}
  .btn.ghost{background:transparent; border-color:var(--border); color:var(--text)}
  .btn.ghost:hover{background:var(--panel-2); border-color:var(--border-strong)}
  .pager{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; flex:1}
  .page-count{font-size:13px; color:var(--muted)}
  .pdot{width:9px; height:9px; padding:0; border-radius:50%; border:1px solid var(--border-strong); background:transparent; cursor:pointer; transition:background .15s, transform .1s}
  .pdot.cur{background:var(--accent); border-color:var(--accent); transform:scale(1.15)}
  .done{text-align:center; padding:36px 0}
  .done .tick{width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:32px; animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:none}}
  .done h2{margin:0 0 8px; font-size:23px; letter-spacing:-.02em}
  .done p{color:var(--muted); margin:0 auto 22px; max-width:460px}
  .done .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(12px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:11px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .fatal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; color:var(--muted)}
  @media (max-width:640px){
    .wrap{padding:20px 14px 120px}
    .bar-in,.foot-in{padding:10px 14px}
    .intro h1{font-size:22px}
    .btn{padding:11px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="dot" aria-hidden="true"></span><span>Brainstormform</span></div>
    <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode">☾</button>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
</header>

<main class="wrap">
  <section class="intro" id="introBox" hidden>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </section>
  <form id="form" novalidate>
    <div class="page" id="pageHost"></div>
  </form>
</main>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <button id="prev" class="btn ghost" type="button">← Back</button>
    <div class="pager" id="pager"></div>
    <button id="next" class="btn primary" type="button">Next →</button>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const base = location.pathname.replace(/\/+$/, '');
  const token = base.split('/').pop();
  const STORE = 'brainstormform:' + token;
  const THEME_KEY = 'brainstormform:theme';
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel) => document.querySelector(sel);
  const pageHost = $('#pageHost');
  const state = {
    spec: null, pages: [], page: 0, dir: 'fwd', byId: {}, cats: {},
    answers: {}, other: {}, previews: {}, submitted: false, startedAt: Date.now(),
  };

  function cssEscape(v) { return window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&'); }
  function qEl(id) { return pageHost.querySelector('[data-qid="' + cssEscape(id) + '"]'); }
  function allQuestions(spec) { return spec.categories.flatMap((c) => c.questions); }
  function currentPage() { return state.pages[state.page]; }
  function isEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0); }

  function buildPages(spec) {
    const size = Math.max(1, (spec.settings && spec.settings.pageSize) || 5);
    const flat = [];
    for (const cat of spec.categories) for (const q of cat.questions) flat.push(q);
    const pages = [];
    for (let i = 0; i < flat.length; i += size) pages.push({ questions: flat.slice(i, i + size) });
    return pages;
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function questionHtml(q) {
    const cat = state.cats[q.id] || '';
    let body = '';
    const val = state.answers[q.id];

    if (q.type === 'single' || q.type === 'multi') {
      const arr = Array.isArray(val) ? val : [];
      const type = q.type === 'single' ? 'radio' : 'checkbox';
      let opts = q.options.map((o) => {
        const checked = q.type === 'single' ? val === o.value : arr.includes(o.value);
        return '<label class="opt' + (checked ? ' sel' : '') + '">' +
          '<input type="' + type + '" name="qf_' + esc(q.id) + '" value="' + esc(o.value) + '"' + (checked ? ' checked' : '') + '>' +
          '<span class="opt-main"><span class="opt-label">' + esc(o.label) + '</span>' +
          (o.description ? '<span class="opt-desc">' + esc(o.description) + '</span>' : '') +
          '</span></label>';
      }).join('');
      if (q.allowOther) {
        const on = q.type === 'single' ? val === '__other__' : arr.includes('__other__');
        opts += '<label class="opt' + (on ? ' sel' : '') + '">' +
          '<input type="' + type + '" name="qf_' + esc(q.id) + '" value="__other__"' + (on ? ' checked' : '') + '>' +
          '<span class="opt-main"><span class="opt-label">Other…</span></span></label>';
        body = '<div class="opts">' + opts + '</div>' +
          '<input class="text-input other-input" type="text" data-other="' + esc(q.id) + '" placeholder="Your answer"' +
          ' value="' + esc(state.other[q.id] || '') + '"' + (on ? '' : ' hidden') + '>';
      } else {
        body = '<div class="opts">' + opts + '</div>';
      }
    } else if (q.type === 'text') {
      body = '<input class="text-input" type="text" data-field="' + esc(q.id) + '" placeholder="' + esc(q.placeholder || '') + '" value="' + esc(val == null ? '' : val) + '">';
    } else if (q.type === 'textarea') {
      const text = val == null ? '' : String(val);
      body = '<div class="ta-wrap"><textarea class="ta" rows="4" data-field="' + esc(q.id) + '" placeholder="' + esc(q.placeholder || '') + '">' + esc(text) + '</textarea><span class="count">' + text.length + '</span></div>';
    } else if (q.type === 'number') {
      body = '<input class="text-input num" type="number" data-field="' + esc(q.id) + '" min="' + q.min + '" max="' + q.max + '" step="' + q.step + '" value="' + esc(val == null ? '' : val) + '" placeholder="' + esc(q.placeholder || '') + '">';
    } else if (q.type === 'scale') {
      let segs = '';
      for (let v = q.min; v <= q.max; v += q.step) {
        segs += '<button type="button" class="seg' + (val === v ? ' sel' : '') + '" data-seg="' + esc(q.id) + '" data-value="' + v + '">' + v + '</button>';
      }
      const labels = Array.isArray(q.scaleLabels) && q.scaleLabels.length
        ? '<div class="scale-labels"><span>' + esc(q.scaleLabels[0]) + '</span><span>' + esc(q.scaleLabels[q.scaleLabels.length - 1]) + '</span></div>' : '';
      body = '<div class="segs">' + segs + '</div>' + labels;
    } else if (q.type === 'boolean') {
      const yes = val === true ? ' sel' : '';
      const no = val === false ? ' sel' : '';
      body = '<div class="segs">' +
        '<button type="button" class="seg' + yes + '" data-seg="' + esc(q.id) + '" data-value="true">Yes</button>' +
        '<button type="button" class="seg' + no + '" data-seg="' + esc(q.id) + '" data-value="false">No</button>' +
        '</div>';
    } else if (q.type === 'file') {
      const files = Array.isArray(val) ? val : [];
      const chips = files.map((f, i) => {
        const preview = state.previews[f.path];
        const thumb = preview ? '<img src="' + preview + '" alt="">' : '<span class="ficon">📎</span>';
        return '<div class="file">' + thumb +
          '<span class="fmeta"><span class="fname">' + esc(f.name) + '</span><span class="fsize">' + fmtSize(f.size) + '</span></span>' +
          '<button type="button" class="rm" data-remove="' + esc(q.id) + '" data-index="' + i + '" aria-label="Remove">✕</button></div>';
      }).join('');
      body = '<div class="drop" data-drop="' + esc(q.id) + '">Drag &amp; drop or click to choose ' + (q.multiple ? 'files' : 'a file') + '</div>' +
        '<input type="file" data-file="' + esc(q.id) + '" accept="' + esc(q.accept) + '"' + (q.multiple ? ' multiple' : '') + ' hidden>' +
        (chips ? '<div class="files">' + chips + '</div>' : '');
    }

    return '<div class="q" data-qid="' + esc(q.id) + '" data-type="' + q.type + '" role="group" aria-labelledby="lbl_' + esc(q.id) + '">' +
      (cat ? '<div class="cat">' + esc(cat) + '</div>' : '') +
      '<div class="qlabel" id="lbl_' + esc(q.id) + '">' + esc(q.label) + (q.required ? '<span class="req" aria-hidden="true">*</span>' : '') + '</div>' +
      (q.help ? '<p class="help">' + esc(q.help) + '</p>' : '<div style="height:2px"></div>') +
      body +
      '<p class="err" hidden></p>' +
      '</div>';
  }

  function render() {
    const page = currentPage();
    pageHost.dataset.dir = state.dir;
    pageHost.innerHTML = page.questions.map(questionHtml).join('');
    pageHost.classList.remove('anim');
    void pageHost.offsetWidth;
    pageHost.classList.add('anim');
    updateFooter();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function refreshQuestion(id) {
    const host = qEl(id);
    if (!host) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = questionHtml(state.byId[id]);
    host.replaceWith(tmp.firstElementChild);
    updateFooter();
  }

  function updateFooter() {
    const last = state.page === state.pages.length - 1;
    $('#prev').disabled = state.page === 0;
    $('#next').textContent = last ? ((state.spec.settings && state.spec.settings.submitLabel) || 'Submit') : 'Next →';
    const progress = ((state.page + 1) / state.pages.length) * 100;
    $('#progressBar').style.width = progress + '%';
    const pager = $('#pager');
    if (state.pages.length <= 15) {
      pager.innerHTML = state.pages.map((_, i) =>
        '<button type="button" class="pdot' + (i === state.page ? ' cur' : '') + '" data-page="' + i + '" aria-label="Page ' + (i + 1) + '"></button>'
      ).join('');
    } else {
      pager.innerHTML = '<span class="page-count">Page ' + (state.page + 1) + ' of ' + state.pages.length + '</span>';
    }
  }

  function save() {
    if (state.submitted) return;
    try {
      localStorage.setItem(STORE, JSON.stringify({ answers: state.answers, other: state.other, page: state.page }));
    } catch { /* storage full or disabled */ }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.answers) Object.assign(state.answers, saved.answers);
      if (saved.other) Object.assign(state.other, saved.other);
      if (Number.isInteger(saved.page)) state.page = Math.min(Math.max(0, saved.page), state.pages.length - 1);
    } catch { /* ignore */ }
  }

  function validateQuestion(q) {
    const v = state.answers[q.id];
    if (q.required && isEmpty(v)) return 'This question is required.';
    if (!isEmpty(v)) {
      if (q.type === 'number') {
        const n = Number(v);
        if (Number.isNaN(n)) return 'Enter a number.';
        if (n < q.min || n > q.max) return 'Enter a value between ' + q.min + ' and ' + q.max + '.';
      }
      if ((q.type === 'single' || q.type === 'multi') && q.allowOther) {
        const usesOther = Array.isArray(v) ? v.includes('__other__') : v === '__other__';
        if (usesOther && !(state.other[q.id] || '').trim()) return 'Please specify your "Other" answer.';
      }
    }
    return null;
  }

  function showError(id, msg) {
    const host = qEl(id);
    if (!host) return;
    const err = host.querySelector('.err');
    if (msg) {
      err.textContent = msg;
      err.hidden = false;
      host.classList.add('invalid');
    } else {
      err.hidden = true;
      host.classList.remove('invalid');
    }
  }

  function validatePage(i) {
    const page = state.pages[i];
    const errors = [];
    for (const q of page.questions) {
      const msg = validateQuestion(q);
      if (i === state.page) showError(q.id, msg);
      if (msg) errors.push({ q, msg });
    }
    return errors;
  }

  function next() {
    if (state.page < state.pages.length - 1) {
      const errors = validatePage(state.page);
      if (errors.length) {
        const host = qEl(errors[0].q.id);
        if (host) host.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toast('Please complete the required questions.');
        return;
      }
      state.page += 1;
      state.dir = 'fwd';
      save();
      render();
    } else {
      submit();
    }
  }

  function prev() {
    if (state.page === 0) return;
    state.page -= 1;
    state.dir = 'back';
    save();
    render();
  }

  function buildOutput() {
    const out = {};
    for (const q of allQuestions(state.spec)) {
      const v = state.answers[q.id];
      if (isEmpty(v)) continue;
      if (q.type === 'single') out[q.id] = { type: 'single', value: v === '__other__' ? null : v, other: (state.other[q.id] || null) };
      else if (q.type === 'multi') out[q.id] = { type: 'multi', value: (Array.isArray(v) ? v : []).filter((x) => x !== '__other__'), other: (state.other[q.id] || null) };
      else if (q.type === 'number') out[q.id] = { type: 'number', value: Number(v) };
      else if (q.type === 'scale') out[q.id] = { type: 'scale', value: Number(v) };
      else if (q.type === 'boolean') out[q.id] = { type: 'boolean', value: !!v };
      else if (q.type === 'file') out[q.id] = { type: 'file', value: v };
      else out[q.id] = { type: q.type, value: v };
    }
    return out;
  }

  function unanswered() {
    return allQuestions(state.spec).filter((q) => q.required && isEmpty(state.answers[q.id])).map((q) => q.id);
  }

  async function submit() {
    let firstBad = -1;
    for (let i = 0; i < state.pages.length; i++) {
      if (validatePage(i).length && firstBad < 0) firstBad = i;
    }
    if (firstBad >= 0) {
      state.page = firstBad;
      state.dir = 'fwd';
      render();
      toast('Please complete the required questions.');
      return;
    }
    const payload = { answers: buildOutput(), unanswered: unanswered(), durationMs: Date.now() - state.startedAt };
    const btn = $('#next');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      const res = await fetch(base + '/api/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.submitted = true;
      try { localStorage.removeItem(STORE); } catch { /* ignore */ }
      showDone(payload);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Submit';
      toast('Could not submit, please try again.');
    }
  }

  function markdown(payload) {
    const lines = ['# ' + state.spec.title, '', '_Submitted ' + new Date().toLocaleString() + '_', ''];
    for (const cat of state.spec.categories) {
      lines.push('## ' + cat.title, '');
      for (const q of cat.questions) {
        const a = payload.answers[q.id];
        lines.push('**' + q.label + '**');
        if (!a) lines.push('_unanswered_');
        else if (a.type === 'file') lines.push(a.value.map((f) => '- ' + f.name + ' (' + f.path + ')').join('\n'));
        else if (Array.isArray(a.value)) lines.push('- ' + a.value.join('\n- ') + (a.other ? ' (other: ' + a.other + ')' : ''));
        else lines.push(String(a.value) + (a.other ? ' (other: ' + a.other + ')' : ''));
        lines.push('');
      }
    }
    return lines.join('\n');
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showDone(payload) {
    $('#foot').hidden = true;
    const answered = Object.keys(payload.answers).length;
    const total = allQuestions(state.spec).length;
    $('#form').innerHTML =
      '<div class="done">' +
      '<div class="tick">✓</div>' +
      '<h2>Answers submitted</h2>' +
      '<p>Your agent has received the answers (' + answered + ' of ' + total + ' questions). You can close this tab or save a copy below.</p>' +
      '<div class="row">' +
      '<button class="btn primary" id="dlJson" type="button">Download JSON</button>' +
      '<button class="btn ghost" id="dlMd" type="button">Download Markdown</button>' +
      '</div></div>';
    $('#dlJson').addEventListener('click', () => download('brainstormform-answers.json', JSON.stringify(payload, null, 2), 'application/json'));
    $('#dlMd').addEventListener('click', () => download('brainstormform-answers.md', markdown(payload), 'text/markdown'));
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function setTheme(mode) {
    document.documentElement.dataset.theme = mode;
    $('#theme').textContent = mode === 'dark' ? '☀' : '☾';
    try { localStorage.setItem(THEME_KEY, mode); } catch { /* ignore */ }
  }

  function initTheme() {
    let mode;
    try { mode = localStorage.getItem(THEME_KEY); } catch { /* ignore */ }
    if (mode !== 'light' && mode !== 'dark') {
      mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    setTheme(mode);
  }

  async function uploadFile(qid, file) {
    try {
      const res = await fetch(base + '/api/upload?name=' + encodeURIComponent(file.name), {
        method: 'POST',
        headers: { 'content-type': file.type || 'application/octet-stream' },
        body: file,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const info = await res.json();
      if (file.type && file.type.startsWith('image/')) state.previews[info.path] = URL.createObjectURL(file);
      if (!Array.isArray(state.answers[qid])) state.answers[qid] = [];
      state.answers[qid].push(info);
      save();
      refreshQuestion(qid);
    } catch (err) {
      toast('Upload failed: ' + file.name);
    }
  }

  async function handleFiles(qid, fileList) {
    const q = state.byId[qid];
    const files = Array.from(fileList || []);
    const room = q.multiple ? Math.max(0, q.maxFiles - (state.answers[qid] || []).length) : 1;
    if (!q.multiple && (state.answers[qid] || []).length) state.answers[qid] = [];
    for (const file of files.slice(0, room)) await uploadFile(qid, file);
    if (files.length > room) toast('Only ' + q.maxFiles + ' file(s) allowed.');
  }

  pageHost.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('input[type=file]')) {
      handleFiles(t.dataset.file, t.files);
      t.value = '';
      return;
    }
    const host = t.closest('[data-qid]');
    if (!host) return;
    const q = state.byId[host.dataset.qid];
    if (!q) return;
    if (q.type === 'single') state.answers[q.id] = t.value;
    else if (q.type === 'multi') state.answers[q.id] = Array.from(host.querySelectorAll('input:checked')).map((i) => i.value);
    else if (q.type === 'text' || q.type === 'textarea') state.answers[q.id] = t.value;
    else if (q.type === 'number') state.answers[q.id] = t.value === '' ? '' : Number(t.value);
    host.querySelectorAll('.opt').forEach((lbl) => lbl.classList.toggle('sel', lbl.querySelector('input').checked));
    const other = host.querySelector('.other-input');
    if (other) {
      const v = state.answers[q.id];
      const on = Array.isArray(v) ? v.includes('__other__') : v === '__other__';
      other.hidden = !on;
      if (on) other.focus();
    }
    showError(q.id, null);
    save();
  });

  pageHost.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.other !== undefined) {
      state.other[t.dataset.other] = t.value;
      showError(t.dataset.other, null);
      save();
      return;
    }
    if (!t.dataset || !t.dataset.field) return;
    const q = state.byId[t.dataset.field];
    if (!q) return;
    state.answers[q.id] = q.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value;
    if (q.type === 'textarea') {
      const count = t.parentElement.querySelector('.count');
      if (count) count.textContent = t.value.length;
    }
    showError(q.id, null);
    save();
  });

  pageHost.addEventListener('click', (e) => {
    const t = e.target;
    if (t.matches && t.matches('input[type=file]')) return;
    const zone = t.closest('[data-drop]');
    if (zone) {
      const input = qEl(zone.dataset.drop).querySelector('input[type=file]');
      if (input) input.click();
      return;
    }
    const rm = t.closest('[data-remove]');
    if (rm) {
      const id = rm.dataset.remove;
      const list = state.answers[id] || [];
      list.splice(Number(rm.dataset.index), 1);
      state.answers[id] = list;
      save();
      refreshQuestion(id);
      return;
    }
    const seg = t.closest('[data-seg]');
    if (seg) {
      const id = seg.dataset.seg;
      const q = state.byId[id];
      state.answers[id] = q.type === 'boolean' ? seg.dataset.value === 'true' : Number(seg.dataset.value);
      qEl(id).querySelectorAll('.seg').forEach((s) => s.classList.toggle('sel', s === seg));
      showError(id, null);
      save();
    }
  });

  pageHost.addEventListener('dragover', (e) => {
    const zone = e.target.closest('[data-drop]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('over');
  });
  pageHost.addEventListener('dragleave', (e) => {
    const zone = e.target.closest('[data-drop]');
    if (zone) zone.classList.remove('over');
  });
  pageHost.addEventListener('drop', (e) => {
    const zone = e.target.closest('[data-drop]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('over');
    handleFiles(zone.dataset.drop, e.dataTransfer.files);
  });

  $('#pager').addEventListener('click', (e) => {
    const dot = e.target.closest('[data-page]');
    if (!dot) return;
    const target = Number(dot.dataset.page);
    if (target === state.page) return;
    if (target > state.page && validatePage(state.page).length) {
      toast('Please complete the required questions.');
      return;
    }
    state.dir = target > state.page ? 'fwd' : 'back';
    state.page = target;
    save();
    render();
  });

  $('#prev').addEventListener('click', prev);
  $('#next').addEventListener('click', () => (state.page === state.pages.length - 1 ? submit() : next()));
  $('#form').addEventListener('submit', (e) => e.preventDefault());
  $('#theme').addEventListener('click', () => {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  document.addEventListener('keydown', (e) => {
    if (state.submitted) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'ArrowRight') next();
  });

  async function boot() {
    initTheme();
    let spec;
    try {
      const res = await fetch(base + '/api/questions');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      spec = await res.json();
    } catch (err) {
      $('#form').innerHTML = '<div class="fatal">Could not load the questions (' + esc(err.message) + '). The session may have expired — ask your agent to start a new one.</div>';
      return;
    }
    state.spec = spec;
    document.title = spec.title || 'Brainstormform';
    $('#title').textContent = spec.title || '';
    $('#intro').textContent = spec.intro || '';
    $('#introBox').hidden = !spec.intro;
    $('#foot').hidden = false;
    state.pages = buildPages(spec);
    for (const cat of spec.categories) for (const q of cat.questions) {
      state.byId[q.id] = q;
      state.cats[q.id] = cat.title;
    }
    restore();
    render();
  }

  boot();
})();
</script>
</body>
</html>
