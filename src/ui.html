<!doctype html>
<html lang="en" data-bf-base="__BF_BASE_URL__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brainstormform</title>
<style>
  :root{
    --bg:#f5f6fb; --bg-2:#eceef7; --panel:#ffffff; --panel-2:#fafbff; --text:#15171f; --muted:#616a7e;
    --border:#e4e7f0; --border-strong:#ccd2e2; --accent:#4f46e5; --accent-2:#8b5cf6; --accent-ink:#ffffff;
    --accent-soft:#eeeefc; --danger:#d14637; --ok:#12a074; --radius:16px; --radius-sm:11px;
    --shadow:0 1px 2px rgba(18,22,40,.05), 0 10px 30px rgba(18,22,40,.07);
    --shadow-lift:0 2px 4px rgba(18,22,40,.06), 0 18px 44px rgba(18,22,40,.12);
  }
  html[data-theme="dark"]{
    --bg:#0c0e14; --bg-2:#11141d; --panel:#161a24; --panel-2:#1b202c; --text:#edf0f7; --muted:#98a1b6;
    --border:#242a38; --border-strong:#333b4d; --accent:#8b8bf5; --accent-2:#b18cf7; --accent-ink:#0e1018;
    --accent-soft:#232a3f; --danger:#ff6f60; --ok:#42d3a0;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 34px rgba(0,0,0,.4);
    --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 22px 52px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), var(--bg);
    color:var(--text); font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%;
  }
  .bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--border)}
  .bar-in{max-width:840px; margin:0 auto; padding:13px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{font-weight:680; letter-spacing:-.015em; display:flex; align-items:center; gap:10px}
  .dot{width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent)}
  .bar-right{display:flex; align-items:center; gap:8px}
  .save-state{font-size:12.5px; color:var(--muted); min-width:64px; text-align:right; transition:opacity .2s}
  .icon-btn{background:transparent; border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:11px; cursor:pointer; font-size:16px; line-height:1; transition:background .15s, border-color .15s, transform .1s}
  .icon-btn:hover{background:var(--panel-2); border-color:var(--border-strong)}
  .icon-btn:active{transform:scale(.94)}
  .progress{height:4px}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s cubic-bezier(.4,0,.2,1)}
  .wrap{max-width:840px; width:100%; margin:0 auto; padding:30px 20px 130px; flex:1}
  .intro{margin:4px 0 24px}
  .intro h1{font-size:30px; line-height:1.2; margin:0 0 10px; letter-spacing:-.03em}
  .intro .md{color:var(--muted)}
  .page-head{margin:2px 0 16px}
  .page-head h2{font-size:21px; margin:0 0 6px; letter-spacing:-.02em}
  .page-head .md{color:var(--muted); font-size:15px}
  .page.anim > .q{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  .page[data-dir="back"].anim > .q{animation-name:riseBack}
  .page.anim > .q:nth-child(2){animation-delay:.03s}
  .page.anim > .q:nth-child(3){animation-delay:.06s}
  .page.anim > .q:nth-child(4){animation-delay:.09s}
  .page.anim > .q:nth-child(5){animation-delay:.12s}
  @keyframes rise{from{opacity:0; transform:translateX(18px)} to{opacity:1; transform:none}}
  @keyframes riseBack{from{opacity:0; transform:translateX(-18px)} to{opacity:1; transform:none}}
  .q{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 20px 18px; margin-bottom:14px; box-shadow:var(--shadow); scroll-margin-top:96px; transition:border-color .2s, box-shadow .2s}
  .q:hover{box-shadow:var(--shadow-lift)}
  .q.invalid{border-color:var(--danger)}
  .q.skipped{opacity:.62}
  .qlabel{font-weight:640; font-size:17px; margin:0 0 4px; letter-spacing:-.015em}
  .qlabel code{font-size:.9em}
  .req{color:var(--accent); margin-left:5px}
  .md{margin:2px 0 0}
  .md p{margin:.4em 0}
  .md ul,.md ol{margin:.4em 0; padding-left:1.3em}
  .md a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px}
  .md code{background:var(--accent-soft); padding:1px 5px; border-radius:5px; font-size:.9em}
  .q .md{color:var(--muted); font-size:14px; margin-bottom:2px}
  .q .content{margin:10px 0 0; font-size:14.5px}
  .opts{display:grid; gap:9px; margin-top:14px}
  .opt{display:flex; gap:12px; align-items:flex-start; padding:13px 15px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; background:var(--panel-2); transition:border-color .16s, background .16s, transform .08s}
  .opt:hover{border-color:var(--border-strong); transform:translateY(-1px)}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .opt input{margin:3px 0 0; accent-color:var(--accent); width:17px; height:17px; flex:none}
  .opt-main{display:flex; flex-direction:column; gap:2px; min-width:0}
  .opt-label{font-weight:540}
  .opt-desc{color:var(--muted); font-size:13.5px}
  .vgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-top:14px}
  .vcard{margin:0; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; cursor:pointer; background:var(--panel-2); display:flex; flex-direction:column; transition:border-color .16s, transform .1s, box-shadow .2s}
  .vcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
  .vcard.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .vcard input{position:absolute; opacity:0; pointer-events:none}
  .vcard img{width:100%; aspect-ratio:16/10; object-fit:cover; background:var(--bg-2); display:block}
  .vcard .vbody{padding:10px 12px}
  .vcard .vlabel{font-weight:560; font-size:14.5px}
  .vcard .vdesc{color:var(--muted); font-size:12.5px}
  .text-input,textarea.ta,input.num{width:100%; font:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; transition:border-color .15s, box-shadow .15s}
  .text-input:focus,textarea.ta:focus,input.num:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.ta{resize:vertical; min-height:110px; margin-top:12px}
  .other-input{margin-top:9px}
  .ta-wrap{position:relative}
  .count{position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none}
  .segs{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .seg{font:inherit; cursor:pointer; padding:10px 16px; min-width:46px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:999px; transition:transform .08s, border-color .15s, background .15s}
  .seg:hover{border-color:var(--border-strong)}
  .seg:active{transform:scale(.95)}
  .seg.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--accent-ink); border-color:transparent}
  .scale-labels{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-top:8px; max-width:440px}
  .mx{overflow-x:auto;margin-top:14px}
  .mx table{border-collapse:collapse;width:100%;font-size:14px}
  .mx th{font-weight:540;text-align:center;padding:6px 8px;color:var(--muted)}
  .mx tbody th{text-align:left;font-weight:520;color:var(--text);white-space:nowrap}
  .mx td{border-top:1px solid var(--border);text-align:center;padding:6px 8px}
  .mx-cell{display:inline-flex;padding:6px}
  .mx input{accent-color:var(--accent);width:18px;height:18px}
  .rank{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  .rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2)}
  .rank-n{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
  .rank-l{flex:1}
  .drop{margin-top:12px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-sm); padding:20px; text-align:center; color:var(--muted); cursor:pointer; background:var(--panel-2); transition:border-color .15s, background .15s, transform .1s}
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--text)}
  .files{display:grid; gap:8px; margin-top:10px}
  .file{display:flex; align-items:center; gap:11px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--panel-2)}
  .file img{width:40px; height:40px; object-fit:cover; border-radius:8px; flex:none}
  .file .ficon{width:40px; height:40px; border-radius:8px; background:var(--accent-soft); display:grid; place-items:center; font-size:15px; flex:none}
  .file .fmeta{min-width:0; flex:1}
  .file .fname{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file .fsize{font-size:12px; color:var(--muted)}
  .rm{font-size:17px; padding:4px 7px; border-radius:7px; background:transparent; border:none; color:var(--muted); cursor:pointer}
  .rm:hover{color:var(--danger); background:var(--panel)}
  .q-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; min-height:20px}
  .skip{background:transparent; border:none; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; text-decoration:underline; text-underline-offset:2px; padding:2px 4px}
  .skip:hover{color:var(--text)}
  .skip.on{color:var(--accent)}
  .note-wrap{margin-top:10px}
  .note-toggle{background:transparent;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:2px 0}
  .note-toggle:hover,.note-toggle.on{color:var(--accent)}
  textarea.note{margin-top:8px;min-height:64px;font-size:14px}
  .rv-note{margin-top:6px;font-size:13px;color:var(--muted);white-space:pre-wrap}
  .err{color:var(--danger); font-size:13.5px; margin:8px 0 0}
  .foot{position:sticky; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px); border-top:1px solid var(--border)}
  .foot-in{max-width:840px; margin:0 auto; padding:13px 20px; display:flex; align-items:center; gap:12px; justify-content:space-between}
  .btn{font:inherit; font-weight:580; cursor:pointer; border-radius:12px; padding:11px 18px; border:1px solid transparent; transition:transform .08s, opacity .15s, background .15s, border-color .15s, box-shadow .2s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--accent-ink); box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 32%, transparent)}
  .btn.primary:hover{opacity:.94}
  .btn.ghost{background:transparent; border-color:var(--border); color:var(--text)}
  .btn.ghost:hover{background:var(--panel-2); border-color:var(--border-strong)}
  .pager{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; flex:1}
  .page-count{font-size:13px; color:var(--muted)}
  .pdot{width:9px; height:9px; padding:0; border-radius:50%; border:1px solid var(--border-strong); background:transparent; cursor:pointer; transition:background .15s, transform .1s}
  .pdot.cur{background:var(--accent); border-color:var(--accent); transform:scale(1.2)}
  .done{text-align:center; padding:40px 0}
  .done .tick{width:70px; height:70px; margin:0 auto 20px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:34px; animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{opacity:0; transform:scale(.5)} to{opacity:1; transform:none}}
  .done h2{margin:0 0 8px; font-size:24px; letter-spacing:-.02em}
  .done p{color:var(--muted); margin:0 auto 24px; max-width:480px}
  .done .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .review h2{font-size:24px; margin:0 0 6px; letter-spacing:-.02em}
  .review > p{color:var(--muted); margin:0 0 20px}
  .rv-cat{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:20px 0 8px}
  .rv{display:grid; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:7px}
  .rv .rq{font-size:13.5px; color:var(--muted)}
  .rv .ra{font-weight:520; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
  .rv .ra.empty{color:var(--muted); font-style:italic; font-weight:400}
  .chip{display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-left:8px; vertical-align:middle}
  .chip.mut{background:var(--bg-2); color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(14px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:50; max-width:90vw; box-shadow:var(--shadow-lift)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .fatal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px; color:var(--muted)}
  @media (max-width:640px){
    .wrap{padding:22px 14px 130px}
    .bar-in,.foot-in{padding:10px 14px}
    .intro h1{font-size:24px}
    .btn{padding:11px 14px}
    .vgrid{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="dot" aria-hidden="true"></span><span id="brandName">Brainstormform</span></div>
    <div class="bar-right">
      <span class="save-state" id="saveState"></span>
      <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode">☾</button>
    </div>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
</header>

<main class="wrap">
  <section class="intro" id="introBox" hidden>
    <h1 id="title"></h1>
    <div class="md" id="intro"></div>
  </section>
  <div id="main"></div>
</main>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <button id="prev" class="btn ghost" type="button">← Back</button>
    <div class="pager" id="pager"></div>
    <div style="display:flex;gap:10px">
      <button id="next" class="btn ghost" type="button">Next →</button>
      <button id="finish" class="btn primary" type="button">Finish</button>
    </div>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="app/ui.js"></script>
</body>
</html>
